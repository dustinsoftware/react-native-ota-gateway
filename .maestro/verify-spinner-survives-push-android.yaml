# Edge case: the spinner's persisted coast must survive an arbitrary DETOUR
# through other surfaces -- not just a single tab roundtrip. Spin it, visit the
# More tab, push (and dismiss) an RN Test screen -- which mounts a different RN
# surface in its own activity and checkpoints its own state slice -- then
# return to Spinner: still coasting. Pins that slices are independent (the
# Test 1 counter checkpoint must not clobber the spinner slice) and that the
# store round-trips across shell tab surfaces AND pushed surfaces.
# NOTE: no self-warm cycle -- run after any warming flow (e.g.
# verify-spinner-persistence) when a fresh export was just deployed in Mode B.
appId: dev.otagateway.host
---
- launchApp
- tapOn: "Spinner"
- extendedWaitUntil:
    visible:
      id: "spinner-state"
    timeout: 60000
- swipe:
    start: "40%, 38%"
    end: "40%, 54%"
    duration: 200
- extendedWaitUntil:
    visible: "spinning"
    timeout: 5000

# Detour: native menu -> pushed RN screen (its own state slice) -> back.
- tapOn: "More"
- assertVisible: "Test 1"
- tapOn: "Test 1"
- extendedWaitUntil:
    visible:
      id: "test-one-screen"
    timeout: 30000
- tapOn:
    id: "test-one-counter"
- pressKey: back
- assertVisible: "Test 3"

# The spinner's slice must have survived the detour untouched.
- tapOn: "Spinner"
- extendedWaitUntil:
    visible:
      id: "spinner-state"
    timeout: 30000
- assertVisible: "spinning"
