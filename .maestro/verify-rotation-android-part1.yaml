# Part 1 of the Android rotation scenario (run via run-rotation-android.sh:
# Maestro cannot rotate the emulator, so the runner rotates between parts).
# Pushes RN Test 1 in its own activity and sets a known counter value. The
# pushed activity declares configChanges for orientation, so React Native --
# not an activity recreation -- handles the rotation in part 2.
appId: dev.otagateway.host
---
- launchApp
- tapOn: "More"
- assertVisible: "Test 1"
- tapOn: "Test 1"
- extendedWaitUntil:
    visible:
      id: "test-one-screen"
    timeout: 60000
- tapOn:
    id: "test-one-reset"
- assertVisible: "Taps: 0"
- tapOn:
    id: "test-one-counter"
- tapOn:
    id: "test-one-counter"
- assertVisible: "Taps: 2"
