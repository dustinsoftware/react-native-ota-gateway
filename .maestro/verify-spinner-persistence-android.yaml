# Verifies the host-state persistence seam on Android: spin the fidget
# spinner, switch native tabs and come back -- the spinner must STILL be
# coasting, resumed from the state checkpointed into SharedPreferences over
# the brownfield message bridge. Under the single persistent RN root
# (docs/single-root-tabs-experiment.md) an RN tab -> RN tab switch no longer
# tears the RN surface down or recreates the activity; it is a soft `selectTab`
# route swap, and expo-router's replace unmounts/remounts the spinner SCREEN
# while the runtime stays live. Either way the coast is frozen at its last
# checkpoint while the screen is off and resumes from the saved slice on
# return. Then the harder variant: force-stop the process and relaunch (a real
# teardown+remount) -- the persisted tab restores Spinner and the coast
# resumes across process death.
#
# Timing note: friction is near-zero (velocity halves roughly every 70s while
# visible, and is frozen while dismissed), so none of these steps race the
# decay.
appId: dev.otagateway.host
---
# Self-warm so the flow runs the freshly-exported bundle: expo-updates
# downloads it in the background on the first launch and applies it on the
# second. Wait for RN to fully boot and give the download time to land before
# the stop, or the relaunch still runs the old bundle.
- launchApp
- tapOn: "Developer"
- extendedWaitUntil:
    visible:
      id: "bundle-marker"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 10000
- stopApp
- launchApp
- tapOn: "Spinner"
- extendedWaitUntil:
    visible:
      id: "spinner-state"
    timeout: 60000

# Stop any residual persisted coast first (a tap zeroes the inertia), so the
# "spinning" assert below can only be satisfied by THIS run's swipe -- without
# this, leftover state from a previous run could mask a dead gesture.
- tapOn:
    id: "fidget-spinner"
- extendedWaitUntil:
    visible: "idle"
    timeout: 5000

# Spin it: a fast VERTICAL swipe down a chord left of the spinner's hub. The
# start point must land on the spinner's touch area on both platforms (its
# center sits at ~43% of the screen on the Android host and ~48% on iOS), and
# an off-center chord is what gives the drag angular leverage -- a swipe
# through the hub imparts nothing.
- swipe:
    start: "40%, 38%"
    end: "40%, 54%"
    duration: 200
# Wrapped in retry for the same reason as the roundtrip/relaunch asserts below:
# on this Maestro version a text-based extendedWaitUntil can abort after a
# single hierarchy poll (~1s) instead of honoring its timeout, so a bare assert
# here flakes when the read-out flips "idle"->"spinning" a beat after the swipe.
# The retry re-arms the wait; id-based waits poll correctly and stay bare.
- retry:
    maxRetries: 3
    commands:
      - extendedWaitUntil:
          visible: "spinning"
          timeout: 15000

# Tab roundtrip on the live root: switching to Sky is a soft route swap (no
# teardown, no activity recreate). expo-router's replace unmounts the spinner
# screen, so the coast freezes at its last checkpoint; returning remounts the
# screen, which resumes the coast from the native store.
#
# The "spinning" waits are wrapped in retry because on this Maestro version
# text-based extendedWaitUntil can abort after a single hierarchy poll (~1s)
# instead of honoring its timeout -- id-based waits poll correctly. The retry
# re-arms the wait so a slow RN boot (the readout flips "idle"->"spinning" a
# couple of seconds after mount) doesn't fail the run.
- tapOn: "Sky"
- tapOn: "Spinner"
- extendedWaitUntil:
    visible:
      id: "spinner-state"
    timeout: 30000
- retry:
    maxRetries: 3
    commands:
      - extendedWaitUntil:
          visible: "spinning"
          timeout: 15000

# Process death: force-stop + relaunch. The persisted tab restores Spinner and
# the coast resumes from the last checkpoint.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "spinner-state"
    timeout: 60000
# The resumed coast's first read-out sample lands within ~800ms of the spinner
# mounting, but a cold start under CI-class machine load can stall emulator
# frames and JS effects for several seconds -- wait (with the retry re-arm
# described above), don't insta-assert.
- retry:
    maxRetries: 3
    commands:
      - extendedWaitUntil:
          visible: "spinning"
          timeout: 15000
